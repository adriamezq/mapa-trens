<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="utf-8">
    <title>Mapa de Trens - Portfoli</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    
    <!-- Importació de la llibreria MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    
    <!-- CSS per fer que el mapa ocupi tota la pantalla -->
    <style>
        body { margin: 0; padding: 0; }
        #mapa { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>

<!-- El contenidor on es dibuixarà el mapa -->
<div id="mapa"></div>

<script>
    // Inicialització del mapa
    const map = new maplibregl.Map({
        container: 'mapa', // L'ID del contenidor HTML de dalt
        
        // AQUÍ HAS DE POSAR EL TEU ENLLAÇ DE MAPTILER
        style: 'https://api.maptiler.com/maps/019db72b-4c75-74e5-8746-50a45e406259/style.json?key=GLB69E1I7MveT2AXj0eu', 
        
        center: [2.17, 41.38], // Coordenades inicials (Longitud, Latitud - ex: Barcelona)
        zoom: 11 // Nivell de zoom inicial
    });

    // Afegir controls de navegació (zoom i rotació)
    map.addControl(new maplibregl.NavigationControl());
</script>

</body>
</html>
